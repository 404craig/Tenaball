# Tenaball's server: accounts (email and 4-digit PIN), stats, and online game rooms.
# Cloudflare builds and deploys this folder (see docs/SERVER_SETUP.md).
name = "tenaball"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# where the game is served from; the server only answers pages on these addresses
ALLOWED_ORIGINS = "https://404craig.github.io"
# wrong PINs allowed before an account is locked, and how long the lock lasts
MAX_PIN_TRIES = "5"
LOCK_MINUTES = "15"

# Secrets (set in the Cloudflare dashboard, never in this file):
#   PIN_SECRET      a long random phrase used to scramble PINs
#   ADMIN_PASSWORD  the password for the admin page at /admin

# lets /status say which version is running
[version_metadata]
binding = "VERSION"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Accounts", "Room"]
