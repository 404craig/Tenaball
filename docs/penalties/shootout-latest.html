<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Tenaball Penalty Shootout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--muted:#e3cde6;--panel:rgba(255,255,255,.08);--panel2:rgba(255,255,255,.14);--slotline:rgba(255,255,255,.16);--acc:#e90052;--acc2:#04f5ff;
  --p1:#04f5ff;--p2:#ffd23f;--p3:#00ff85;--p4:#c77dff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--ink:#fff}}
:root[data-theme="light"],:root[data-theme="dark"]{--ink:#fff}
*,*::before,*::after{box-sizing:inherit}
html,body{min-height:100%;margin:0}
body{background:radial-gradient(120% 90% at 20% 0%,#4a0f5c 0%,#2a0633 40%,#12021a 100%);color:var(--ink);font-family:Outfit,"Avenir Next",system-ui,sans-serif;display:flex;justify-content:center}
.hidden{display:none!important}
.wrap{width:min(92vw,440px);padding:26px 0 40px}
h1{font-size:2rem;font-weight:800;margin:0 0 4px;text-align:center}
.lead{color:var(--muted);text-align:center;margin:0 0 20px}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}
.namebox{display:flex;gap:8px;margin-bottom:8px}
.namebox input{flex:1;font:inherit;font-size:1rem;padding:11px 14px;border-radius:12px;border:1.5px solid var(--slotline);background:rgba(0,0,0,.28);color:#fff}
.namebox button{width:44px;border:0;border-radius:12px;background:var(--panel2);color:#fff;font-size:1rem}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:14px 20px;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;background:var(--acc);color:#fff;box-shadow:0 8px 24px -10px var(--acc)}
.btn.ghost{background:transparent;border:1.5px solid var(--slotline);box-shadow:none}
.btn:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.addrow{display:flex;gap:8px;margin:10px 0 16px}.addrow .btn{flex:1}
.toggle{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:12px 14px;margin:6px 0 16px;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:#00ff85}
.toggle small{display:block;color:var(--muted);font-weight:400}
.overlay{position:static}
.btn.soNext{background:linear-gradient(90deg,#04f5ff,#00ff85);color:#1a0020;box-shadow:none}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),105vh,0) rotate(var(--rot))}}
@media (prefers-reduced-motion: reduce){.cf{display:none}}
@keyframes cardIn { 
  0% { opacity: 0; transform: translateY(24px) scale(0.96); }
  100% { opacity: 1; transform: none; }
}
.soCard { width: min(92vw, 440px); text-align: center; animation: 0.4s ease 0s 1 normal both running cardIn; }
.soHead { font-size: 1.9rem; font-weight: 800; letter-spacing: 0.02em; }
.soSub { color: var(--muted); font-size: 0.95rem; margin: 2px 0px 10px; }
.soTally { display: flex; flex-direction: column; gap: 6px; margin: 0px auto 12px; max-width: 340px; }
.soTally .row { display: flex; align-items: center; gap: 10px; background: var(--panel); border-radius: 12px; padding: 6px 12px; }
.soTally .nm { flex: 1 1 0%; text-align: left; font-weight: 700; color: var(--pc); }
.soTally .kicks { display: flex; gap: 5px; }
.soTally .kicks i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255, 255, 255, 0.18); display: grid; place-items: center; font-style: normal; font-size: 0.62rem; font-weight: 800; }
.soTally .kicks i.g { background: rgb(0, 255, 133); color: rgb(0, 58, 28); }
.soTally .kicks i.m { background: rgb(255, 45, 111); color: rgb(255, 255, 255); }
.soTally .row.out { opacity: 0.4; }
.soGoal { position: relative; width: min(70vw, 260px); margin: 4px auto 10px; }
.soGoal svg { display: block; width: 100%; }
.soKeeper { position: absolute; left: 50%; top: 38%; font-size: 1.7rem; transform: translate(-50%, -50%); }
.soBall { position: absolute; left: 50%; bottom: -18px; font-size: 1.5rem; transform: translate(-50%, 0px); }
.soWord { position: absolute; left: 0px; right: 0px; top: 34%; font-size: 2rem; font-weight: 800; opacity: 0; text-shadow: rgba(0, 0, 0, 0.6) 0px 3px 12px; }
.soTaker { font-weight: 800; font-size: 1.15rem; margin-top: 8px; }
.soQ { font-size: 1.3rem; font-weight: 800; line-height: 1.25; margin: 6px 0px 4px; }
.soPeriod { font-size: 0.8rem; color: var(--muted); margin-bottom: 12px; }
.soOpts { display: grid; gap: 10px; }
.soOpts button { border-radius: 14px; padding: 14px 16px; font-style: inherit; font-variant: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-weight: 800; font-size: 1.05rem; background: var(--panel2); color: var(--ink); border: 1.5px solid var(--slotline); }
.soOpts button:active { transform: scale(0.98); }
.soReveal { min-height: 1.4em; margin-top: 12px; font-weight: 700; font-size: 0.95rem; }
.soNext { margin-top: 12px; width: 100%; }


.soGoal{position:relative;width:min(80vw,300px);margin:4px auto 6px}
.soGoal svg.pitch{display:block;width:100%;overflow:visible}
.soGoal .kp{transform-box:view-box;transform-origin:100px 82px}
.soGoal .armL{transform-box:view-box;transform-origin:93px 51.3px;transform:rotate(-28deg)}
.soGoal .armR{transform-box:view-box;transform-origin:107px 51.3px;transform:rotate(28deg)}
.soGoal .net{transform-box:view-box;transform-origin:100px 45px}
.soGoal .ball{transform:translate(100px,112px)}
.soWord{position:absolute;left:0;right:0;top:-6%;font-size:1.8rem;font-weight:800;opacity:0;text-shadow:0 3px 12px rgba(0,0,0,.7);pointer-events:none}



.soGoal{position:relative;width:min(84vw,320px);aspect-ratio:200/150;margin:4px auto 6px}
.soGoal svg.pitch{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:visible}
.soGoal svg.back{border-radius:12px}
.soGoal #kpCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.soGoal #soBall,.soGoal #soBallSpin,.soGoal #kpShadow,.soGoal #soBallShadow{transform-box:view-box;transform-origin:0 0}
.soGoal #kpShadow{transform-origin:100px 84.2px}
.soGoal #soBallShadow{transform-origin:100px 113.5px}
.soGoal #soBall{transform:translate(100px,112px)}
.soWord{position:absolute;left:0;right:0;top:-8%;font-size:1.8rem;font-weight:800;opacity:0;text-shadow:0 3px 12px rgba(0,0,0,.7);pointer-events:none}

/* keeper style switch: pixel keeper or the original floating gloves */
.soMode{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin:2px 0 6px}
.soMode button{font-size:.74rem !important;padding:5px 10px !important}
.soMode button{border:1.5px solid var(--slotline,rgba(255,255,255,.18));background:transparent;color:var(--ink,#fff);border-radius:999px;padding:6px 14px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.soMode button[aria-pressed="true"]{background:#fff;color:#1a0020;border-color:#fff}
.soGoal .gloveKeeper{font-size:15px;pointer-events:none}

/* Match commentary in a Football Manager style bar, in the kicker's colour */
.fmBox{display:flex;align-items:stretch;min-height:48px;margin:6px auto 2px;max-width:440px;border-radius:6px;overflow:hidden;background:var(--fc,#04f5ff);color:#14021c;box-shadow:0 4px 14px rgba(0,0,0,.35);text-align:left;transition:background .25s}
.fmBox.hidden{display:none}
.fmBox .tag{flex:none;display:flex;align-items:center;justify-content:center;min-width:46px;padding:0 8px;background:rgba(0,0,0,.28);color:#fff;font-weight:800;font-size:.78rem;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.fmBox .txt{flex:1;padding:8px 12px;font-weight:700;font-size:.95rem;line-height:1.25;display:flex;align-items:center}
.fmBox.goal .txt,.fmBox.save .txt,.fmBox.miss .txt,.fmBox.win .txt{font-weight:800;font-size:1.02rem}
.fmBox.save .tag,.fmBox.miss .tag{background:rgba(0,0,0,.45)} .fmBox.win{background:linear-gradient(90deg,var(--fc,#04f5ff),#fff)}
.fmBox.flash{animation:fmFlash .9s ease 1}
@keyframes fmFlash{0%,40%,80%{filter:brightness(1.35)}20%,60%,100%{filter:brightness(1)}}
@media (prefers-reduced-motion: reduce){.fmBox.flash{animation:none}}
.soTally .kicks i.p{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.soTally .kicks .sd{width:1px;height:14px;background:rgba(255,255,255,.35);margin:0 3px}
.soTally .tot{font-weight:800;min-width:18px;text-align:right;font-variant-numeric:tabular-nums}
.soStage{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted,#d8c6e4);margin:-4px 0 8px}
.presets{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.presets button{border:1.5px solid rgba(255,255,255,.2);background:transparent;color:inherit;border-radius:999px;padding:7px 12px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}

/* neutral commentary, full-bar takeovers, the toss, and the settings drawer */
.fmBox.neutral{background:#f4f1f8;color:#14021c} .fmBox.neutral .tag{background:#2a0a3a}
.fmBox.big{justify-content:center} .fmBox.big .tag{display:none}
.fmBox.big .txt{justify-content:center;text-align:center;font-size:1.5rem;font-weight:900;letter-spacing:.06em;font-style:italic}
.fmBox.bigflash{animation:fmBig .34s steps(2,end) 12}
@keyframes fmBig{0%{filter:brightness(1.5) saturate(1.2)}100%{filter:brightness(.85)}}
.soGoal{position:relative}
.toss{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;perspective:600px}
.toss .coin{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.05rem;letter-spacing:.02em;
  background:radial-gradient(circle at 35% 30%,#fff6c8,#ffd23f 45%,#c99410 100%);box-shadow:0 0 0 3px #fff3,0 10px 30px rgba(0,0,0,.5),inset 0 -4px 10px rgba(0,0,0,.25);transform-style:preserve-3d}
.toss .coin span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#1a0326;color:var(--tc,#fff);font-size:1.7rem;font-weight:900}
.toss .who{position:absolute;bottom:20%;left:0;right:0;font-weight:900;font-size:1.15rem;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.toss .lbl{position:absolute;top:8%;left:0;right:0;font-weight:800;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.soGear{position:absolute;top:10px;right:10px;z-index:3;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;font-size:1.05rem;display:grid;place-items:center;cursor:pointer}
.soDrawer{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(78vw,280px);background:#1d0428;border-left:1px solid rgba(255,255,255,.12);box-shadow:-10px 0 30px rgba(0,0,0,.5);
  padding:calc(18px + env(safe-area-inset-top,0px)) 16px 18px;transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column;gap:10px;text-align:left}
.soDrawer.open{transform:none}
.soDrawer h3{margin:0 0 4px;font-size:1rem}
.soDrawer .soMode{flex-direction:column;align-items:stretch}
.soDrawer .soMode button{font-size:.9rem !important;padding:10px 12px !important;text-align:left}
.soDrawer .close{align-self:flex-end;background:transparent;border:1.5px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
.soCard{position:relative}
#shootout .soCard{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;justify-content:center}
.soHead{padding:0 44px;font-size:1.6rem !important}
#shootout .soCard .fmBox,#shootout .soCard .soTally{width:100%;box-sizing:border-box}
#shootout .soCard .soTally{max-width:440px}
.soSub{display:none}
@media (prefers-reduced-motion: reduce){.fmBox.bigflash{animation:none}.soDrawer{transition:none}}

/* commentary bar: a small centred label line (Round 1, Sudden death...) above centred text of one or two lines */
.fmBox{flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:68px;padding:7px 14px}
.fmBox .tag{min-width:0;padding:0;background:none !important;color:inherit;opacity:.72;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800}
.fmBox .txt{padding:2px 0 0;justify-content:center;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fmBox.big .txt{display:flex}
.toss .coinImg{width:30%;max-width:120px;image-rendering:pixelated;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
</style></head>
<body><div class="wrap">
<section id="setup">

  <p class="lead">Tenaball's tie-breaker: five kicks each, then sudden death</p>

  <div id="names"></div>
  <div class="addrow"><button class="btn ghost" id="addBtn" type="button">+ Add player</button></div>
  <div class="presets" role="group" aria-label="Quick player set-ups"><span style="align-self:center;font-size:.85rem;opacity:.8">Try it with</span><button type="button" data-n="2">2 players</button><button type="button" data-n="3">3 players</button><button type="button" data-n="4">4 players</button></div>
  <label class="toggle"><input type="checkbox" id="auto"><span>Auto-play<small>Each kick picks an answer at random, to watch a shootout play out</small></span></label>
  <button class="btn" id="startBtn" type="button">Start shootout</button>
</section>

      <linearGradient id="kStand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c0426"/><stop offset="1" stop-color="#3a0a4c"/></linearGradient>
      <linearGradient id="kBoard" x1="0" x2="1"><stop offset="0" stop-color="#04f5ff"/><stop offset=".5" stop-color="#00ff85"/><stop offset="1" stop-color="#04f5ff"/></linearGradient>
      <linearGradient id="kBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(10,0,20,.25)"/><stop offset="1" stop-color="rgba(10,0,20,.55)"/></linearGradient>

    <path d="M28 83 L172 83 L180 96 L20 96 Z" fill="none" stroke="#fff" stroke-width=".9" opacity=".8"/>
    <line x1="-30" y1="83" x2="230" y2="83" stroke="#fff" stroke-width="1.1" opacity=".9"/>

    <ellipse id="kpShadow" cx="100" cy="84.2" rx="12" ry="1.8" fill="rgba(0,0,0,.35)"/>

let AC=null; function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==="suspended") AC.resume(); return AC; }
function tone(f,dur,type="sine",vol=.1,when=0,slideTo){ const a=ac(); if(!a) return; const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+when; o.type=type; o.frequency.setValueAtTime(f,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05); }
function bell(f,when=0,dur=1.2,vol=.1){ const a=ac(); if(!a) return; const t=a.currentTime+when; [[1,1,1],[2,.35,.6],[3,.18,.4]].forEach(([m,amp,len])=>{ const o=a.createOscillator(),g=a.createGain(); o.frequency.value=f*m; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol*amp,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+dur*len); o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur*len+.05); }); }
function whistle(pattern){ const a=ac(); if(!a) return; pattern.forEach(([s,d])=>{ const t=a.currentTime+s, o=a.createOscillator(), tr=a.createOscillator(), tg=a.createGain(), g=a.createGain(); o.frequency.value=2950; tr.frequency.value=34; tg.gain.value=140; tr.connect(tg).connect(o.frequency); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.1,t+.02); g.gain.setValueAtTime(.1,t+Math.max(.03,d-.05)); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.05); tr.start(t); tr.stop(t+d+.05); }); }

function drawNames(){ const box=$("names"); box.innerHTML=""; names.forEach((n,i)=>{ const d=document.createElement("div"); d.className="namebox";

  d.querySelector("input").oninput=e=>names[i]=e.target.value; d.querySelector("button").onclick=()=>{ if(names.length>2){ names.splice(i,1); drawNames(); } };
  d.querySelector("button").disabled = names.length<=2; box.appendChild(d); }); $("addBtn").disabled = names.length>=4; }

/* Index 0 is the central ready stance (made from your frame 1, with both gloves low); 1 to 10 are your dive frames.

   so he now keeps the same size all the way through the dive. */
const GKS = 0.451;   // 10% larger than before
const GROUND = 84;
const GKT = [70, 70, 70, 60, 50, 60, 90, 80, 90, 0];   // time to reach frames 1 to 10 (ms)
const sc = i => GKS * GK[i].s;
const groundY = i => GROUND - (GK[i].h - GK[i].cy) * sc(i);

function gkEls(){
  const root = $("soKpRig"); if (!root) return null;
  if (!gkImg){
    const mk = () => { const e = document.createElementNS("http://www.w3.org/2000/svg","image"); e.setAttribute("style","image-rendering:pixelated"); return e; };
    gkGhost = mk(); gkGhost.setAttribute("opacity","0"); gkImg = mk(); gkBlend = mk(); gkBlend.setAttribute("opacity","0");
    root.appendChild(gkGhost); root.appendChild(gkImg); root.appendChild(gkBlend);

}
// the outside edges of the posts: the keeper never goes beyond them
const GOAL_OUT_L = 8.5, GOAL_OUT_R = 191.5;
function placeImg(el, i, P){ const f = GK[i], k = sc(i), W = f.w*k;
  let x = P[0] - f.cx*k; x = W >= GOAL_OUT_R - GOAL_OUT_L ? (GOAL_OUT_L + GOAL_OUT_R - W) / 2 : Math.max(GOAL_OUT_L, Math.min(GOAL_OUT_R - W, x));
  el.setAttribute("href", f.src); el.setAttribute("x", x.toFixed(2)); el.setAttribute("y", (P[1] - f.cy*k).toFixed(2));
  el.setAttribute("width", W.toFixed(2)); el.setAttribute("height", (f.h*k).toFixed(2)); }
/* Show frame i at P. Optionally blend frame j (at Pj) over it with opacity a: a short cross-dissolve between drawings. */
let gkCur = { f: 23, P: [100, 0], m: false }, ballHeld = false;
function showGK(i, P, mirror, j, Pj, a){ const root = gkEls(); if (!root) return;
  if (GK[i].db || (j != null && GK[j].db && a > .5)) ballHeld = true;   // once he has it, the flying ball stays hidden until the next kick
  const bl = $("soBall"); if (bl) bl.style.opacity = ballHeld ? "0" : "";
  const bs = $("soBallShadow"); if (bs && ballHeld) bs.style.opacity = "0";

}

/* Frame groups from your latest artwork */

async function coinToss(players){
  /* your coin: spins fast through its nine frames, slows, settles face up and fades; who starts is told in the commentary */
  const goal = document.querySelector("#shootout .soGoal"); if (!goal) return 0;
  const win = Math.floor(Math.random() * players.length), wrap = document.createElement("div"); wrap.className = "toss";
  const img = document.createElement("img"); img.className = "coinImg"; img.alt = ""; wrap.appendChild(img); goal.appendChild(wrap);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, N = COIN_FRAMES.length;
  if (!reduce){ const total = 3000, t0 = performance.now(); let i = 0, next = t0;
    await new Promise(res => { const tick = now => { const u = Math.min(1, (now - t0) / total);
        if (now >= next){ img.src = COIN_FRAMES[i % N]; i++; next = now + 34 + Math.pow(u, 2.4) * 190; if (i % N === 1) { try{ tone(1200, .03, "square", .02); }catch(e){} } }
        img.style.transform = `translateY(${(-Math.sin(Math.min(1, u * 1.15) * Math.PI) * 40).toFixed(1)}%)`;
        if (u < 1) requestAnimationFrame(tick); else res(); }; requestAnimationFrame(tick); }); }
  img.src = COIN_FRAMES[0]; img.style.transform = "";
  img.animate([{ transform: "scale(1)" }, { transform: "scale(1.18)" }, { transform: "scale(1)" }], { duration: 360 });
  try{ bell(1047, 0, .9, .1); bell(1568, .1, 1.1, .08); }catch(e){}

      // end-of-round round-up, in neutral white, before the next round begins
      const goneNow = L.filter(p => st.get(p).out), stillIn = live(), lead = Math.max(...stillIn.map(p => st.get(p).goals)), leaders = stillIn.filter(p => st.get(p).goals === lead);
      const tableLine = order.filter(p => !st.get(p).out || goneNow.includes(p)).map(p => `${p.name} ${st.get(p).goals}`).join(", ");
      commHurry = true; await commIdle(); commHurry = false;
      say(round <= REG ? `End of round ${round}. ${tableLine}.` : `End of sudden death round ${round}. ${tableLine}.`, null, "neutral", round <= REG ? "R" + round : "SD", 2600);
      if (goneNow.length) say(`${goneNow.map(p => p.name).join(" and ")} ${goneNow.length > 1 ? "are" : "is"} out. ${stillIn.map(p => p.name).join(", ").replace(/, ([^,]*)$/, " and $1")} go on.`, null, "neutral", "R" + round, 2600);
      else if (round < REG) say(leaders.length === stillIn.length ? `All square going into round ${round + 1}.` : `${leaders.map(p => p.name).join(" and ")} ${leaders.length > 1 ? "lead" : "leads"} going into round ${round + 1}.`, null, "neutral", "R" + round, 2600);
      else if (round > REG) say(`Still nothing to separate them. On to round ${round + 1}.`, null, "neutral", "SD", 2600);
      await tap("Next round");
    }
  }
  // the decisive kick has played out; hold on the moment before moving on
  const ranked = order.slice().sort((a, b) => st.get(b).goals - st.get(a).goals);
  const score = tied.length === 2 ? ranked.map(p => st.get(p).goals).join("–") : "(" + ranked.map(p => `${p.name} ${st.get(p).goals}`).join(", ") + ")";
  drawTally();
  $("soTaker").innerHTML = `<span style="color:${winner.color}">${esc(winner.name)}</span> wins the shootout ${score}!`;
  $("soQ").textContent = "+1 point"; $("soPeriod").textContent = "";
  clearComm(); comm(`${winner.name} wins the shootout ${score}!`, winner.color, "win", "FT");
  await wait(3200);
  await new Promise(res => { const n = $("soNext"); n.textContent = "Play again"; n.classList.remove("hidden"); n.onclick = () => { n.classList.add("hidden"); res(); }; });
  stopKeeper(); cancelAnimationFrame(gloveRaf); toggleDrawer(false);
  ov.classList.add("hidden");
}
try{ NET.reset(); applyKeeperMode(); if (GLOVES) glovesReady(); else keeperReady(); }catch(e){}
</script></body></html>
