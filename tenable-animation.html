<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Tenable Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--ink:#fff}}
:root[data-theme="light"],:root[data-theme="dark"]{--ink:#fff}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:#14021e;color:var(--ink);font-family:Outfit,"Avenir Next",system-ui,sans-serif;overflow:hidden}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.start{text-align:center;max-width:420px;margin:0 auto}
.start h1{font-size:2rem;font-weight:800;margin:0 0 6px} .start p{color:#d9c8ef;margin:0 0 22px}
.start label{display:block;text-align:left;font-weight:600;font-size:.9rem;margin:0 0 6px}
.start input{width:100%;font:inherit;font-size:1rem;padding:11px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.18);background:rgba(0,0,0,.3);color:#fff;margin-bottom:12px}
.row2{display:flex;gap:10px} .row2>div{flex:1}
.btn{border:0;border-radius:999px;padding:13px 20px;font:inherit;font-weight:800;font-size:1.02rem;cursor:pointer}
.play{width:100%;margin-top:6px;color:#1a0020;background:linear-gradient(90deg,#04f5ff,#00ff85);box-shadow:0 10px 30px -8px rgba(4,245,255,.6)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.final{justify-content:flex-start;padding-top:60px} .final .inner{width:min(86vw,420px)}
.final h1{font-size:2.3rem;line-height:1.1;margin:0} .final .sub{font-size:1rem;color:#e0cdef;margin:6px 0 14px}
.pod{display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.08);margin-bottom:8px}
.pod .place{font-weight:800;font-size:1.15rem;width:40px;color:#d3bcd8} .pod .nm{flex:1;font-weight:700;font-size:1.05rem} .pod .sc{font-weight:800;font-size:1.35rem}
.pod.first{background:linear-gradient(90deg,#04f5ff,#00ff85);color:#1a0020} .pod.first .place{color:#1a0020}
.again{margin-top:10px;width:100%;color:#fff;background:#e90052}

.bgbase{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 42%,#33104f 0%,#1d0530 52%,#0c0214 100%)}
.bgshift{position:absolute;inset:0;pointer-events:none;opacity:0}
.bgshift.a{background:radial-gradient(70% 55% at 0% 0%,rgba(120,30,90,.22),transparent 70%);animation:shiftA 13s ease-in-out 1.1s infinite alternate}
.bgshift.b{background:radial-gradient(70% 55% at 100% 0%,rgba(40,60,160,.2),transparent 70%);animation:shiftB 11s ease-in-out 1.1s infinite alternate}
@keyframes shiftA{from{opacity:.15}to{opacity:.55}} @keyframes shiftB{from{opacity:.5}to{opacity:.1}}
.pulse{position:absolute;left:50%;top:44%;width:60vmax;height:60vmax;margin:-30vmax 0 0 -30vmax;border-radius:50%;opacity:0;pointer-events:none;background:radial-gradient(circle,transparent 38%,rgba(150,80,220,.22) 50%,transparent 62%)}
.bolts{position:absolute;inset:0;pointer-events:none}
.bolt{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
.bolt svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bolt .bshine{mix-blend-mode:screen}
.particles{position:absolute;inset:0;pointer-events:none}
.particles i{position:absolute;width:var(--sz);height:var(--sz);border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);opacity:0;animation:drift var(--d) linear var(--dl) infinite}
@keyframes drift{0%{transform:translateY(0);opacity:0}12%{opacity:var(--o)}50%{opacity:calc(var(--o) * 1.6)}88%{opacity:var(--o)}100%{transform:translateY(calc(var(--rise) * -1));opacity:0}}
.dark{position:absolute;inset:0;background:#07010c;opacity:0;pointer-events:none}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tzone{position:relative;width:min(74vw,360px)}
.glow{position:absolute;left:50%;border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}
.glow.core{top:62%;width:78%;height:62%;background:radial-gradient(circle,rgba(60,255,210,.85) 0%,rgba(4,245,255,.45) 35%,transparent 70%);filter:blur(6px)}
.glow.emerald{top:60%;width:120%;height:90%;background:radial-gradient(circle,rgba(0,255,133,.5) 0%,rgba(0,190,110,.22) 45%,transparent 72%);filter:blur(10px)}
.glow.haze{top:55%;width:185%;height:120%;background:radial-gradient(ellipse,rgba(4,245,255,.22) 0%,rgba(4,200,220,.1) 45%,transparent 72%);filter:blur(14px)}
.glow.purple{top:20%;width:110%;height:60%;background:radial-gradient(ellipse,rgba(190,70,255,.45) 0%,rgba(150,40,220,.18) 45%,transparent 72%);filter:blur(10px)}
.flash{position:absolute;left:50%;top:52%;width:120%;height:110%;transform:translate(-50%,-50%);border-radius:50%;opacity:0;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(160,255,245,.7) 28%,transparent 62%)}
.floor{position:absolute;left:50%;top:97%;width:110%;height:16%;transform:translateX(-50%);pointer-events:none}
.floor i{position:absolute;inset:0;border-radius:50%}
.floor .fg{background:radial-gradient(ellipse,rgba(0,255,133,.45),rgba(4,245,255,.15) 45%,transparent 70%);opacity:0}
.floor .fv{background:radial-gradient(ellipse at 50% 30%,rgba(170,70,255,.35),transparent 60%);opacity:0}
.floor .fs{background:radial-gradient(ellipse,rgba(255,255,255,.35),transparent 60%);opacity:0}
.trophy{position:relative;width:100%;opacity:0;will-change:transform,opacity,filter}
.trophy .tbase{position:absolute;inset:0;width:100%;height:100%;display:block}
.trophy .lyr{position:absolute;inset:0;pointer-events:none;-webkit-mask:var(--sil) 0 0/100% 100% no-repeat;mask:var(--sil) 0 0/100% 100% no-repeat}
.lt{opacity:0}
.lt.key{background:radial-gradient(90% 70% at 18% 12%,rgba(255,255,255,.55),transparent 60%);mix-blend-mode:overlay}
.lt.turq{background:radial-gradient(80% 70% at 5% 95%,rgba(4,245,255,.6),transparent 65%);mix-blend-mode:screen}
.lt.green{background:radial-gradient(80% 70% at 95% 95%,rgba(0,255,133,.55),transparent 65%);mix-blend-mode:screen}
.lt.purple{background:radial-gradient(90% 60% at 55% -10%,rgba(190,70,255,.6),transparent 65%);mix-blend-mode:screen}
.idle .lt.key{animation:ltKey 6.1s ease-in-out 1.1s infinite alternate}
.idle .lt.turq{animation:ltTurq 4.5s ease-in-out 1.1s infinite alternate}
.idle .lt.green{animation:ltGreen 3.9s ease-in-out 1.5s infinite alternate}
.idle .lt.purple{animation:ltPurple 5.3s ease-in-out 1.1s infinite alternate}
@keyframes ltKey{from{opacity:.55}to{opacity:.68}} @keyframes ltTurq{from{opacity:.45}to{opacity:.6}}
@keyframes ltGreen{from{opacity:.42}to{opacity:.58}} @keyframes ltPurple{from{opacity:.58}to{opacity:.42}}
.trophy .edge{opacity:.8;mix-blend-mode:screen}
.edge.gL{-webkit-mask:var(--sil) 0 0/100% 100% no-repeat,linear-gradient(90deg,transparent 12%,#000 18%,#000 36%,transparent 42%);-webkit-mask-composite:source-in;mask:var(--sil) 0 0/100% 100% no-repeat intersect,linear-gradient(90deg,transparent 12%,#000 18%,#000 36%,transparent 42%);
  background:linear-gradient(0deg,transparent 0,rgba(0,255,133,.0) 40%,rgba(0,255,133,.75) 50%,rgba(0,255,133,0) 60%,transparent 100%) 0 0/100% 300% no-repeat;background-position:0 100%}
.edge.gR{-webkit-mask:var(--sil) 0 0/100% 100% no-repeat,linear-gradient(90deg,transparent 58%,#000 64%,#000 82%,transparent 88%);-webkit-mask-composite:source-in;mask:var(--sil) 0 0/100% 100% no-repeat intersect,linear-gradient(90deg,transparent 58%,#000 64%,#000 82%,transparent 88%);
  background:linear-gradient(0deg,transparent 0,rgba(0,255,133,0) 40%,rgba(60,255,200,.7) 50%,rgba(0,255,133,0) 60%,transparent 100%) 0 0/100% 300% no-repeat;background-position:0 0}
.idle .edge.gL{animation:riseL 4.5s ease-in-out 1.3s infinite} .idle .edge.gR{animation:fallR 5.2s ease-in-out 3.1s infinite}
@keyframes riseL{0%{background-position:0 100%}33%,100%{background-position:0 0}}
@keyframes fallR{0%{background-position:0 0}30%,100%{background-position:0 100%}}
.edge.pur{background:linear-gradient(180deg,rgba(200,90,255,.55) 0%,rgba(160,60,240,.25) 30%,transparent 55%,transparent 78%,rgba(170,70,255,.35) 100%);mix-blend-mode:screen;opacity:.35}
.idle .edge.pur{animation:purOsc 5.7s ease-in-out 1.1s infinite alternate}
@keyframes purOsc{from{opacity:.3;filter:hue-rotate(0deg)}to{opacity:.42;filter:hue-rotate(18deg)}}
.crown{-webkit-mask:var(--sil) 0 0/100% 100% no-repeat,linear-gradient(180deg,#000 0,#000 18%,transparent 24%);-webkit-mask-composite:source-in;mask:var(--sil) 0 0/100% 100% no-repeat intersect,linear-gradient(180deg,#000 0,#000 18%,transparent 24%);
  background:linear-gradient(100deg,transparent 30%,rgba(210,150,255,.55) 45%,rgba(255,220,255,.35) 50%,transparent 62%) 0 0/260% 100% no-repeat;mix-blend-mode:screen;opacity:.8;background-position:120% 0}
.idle .crown{animation:crownDrift 8.3s ease-in-out 1.1s infinite alternate}
@keyframes crownDrift{from{background-position:120% 0}to{background-position:-20% 0}}
.cry{position:absolute;width:12%;aspect-ratio:1;margin:-6% 0 0 -6%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(230,170,255,.7),rgba(170,80,255,.25) 40%,transparent 70%);mix-blend-mode:screen;opacity:.15}
.cry.c1{left:36%;top:9%} .cry.c2{left:51%;top:7%;width:15%;margin:-7.5% 0 0 -7.5%} .cry.c3{left:66%;top:9%}
.idle .cry.c1{animation:cry 4.7s ease-in-out 1.1s infinite alternate} .idle .cry.c2{animation:cry2 5.9s ease-in-out 1.6s infinite alternate} .idle .cry.c3{animation:cry 6.8s ease-in-out 2.4s infinite alternate-reverse}
@keyframes cry{from{opacity:.08}to{opacity:.45}} @keyframes cry2{from{opacity:.2}to{opacity:.6}}
.sweep{opacity:0;background:linear-gradient(125deg,transparent 30%,rgba(255,255,255,.0) 36%,rgba(255,255,255,.55) 47%,rgba(255,255,255,.75) 50%,rgba(255,255,255,.55) 53%,rgba(255,255,255,0) 64%,transparent 70%) 0 0/300% 300% no-repeat;background-position:100% 100%}
.sweep.s1{mix-blend-mode:overlay} .sweep.s2{mix-blend-mode:screen;filter:opacity(.45)}
.idle .sweep{animation:mainSweep 4.5s cubic-bezier(.45,0,.35,1) 1.6s infinite}
@keyframes mainSweep{0%{opacity:0;background-position:100% 100%}3%{opacity:1}20%{opacity:1}23%{opacity:0;background-position:0% 0%}100%{opacity:0;background-position:0% 0%}}
.emb{-webkit-mask:var(--sil) 0 0/100% 100% no-repeat,radial-gradient(circle at 51% 36%,transparent 0,transparent 8.5%,#000 10%,#000 11.8%,transparent 13%);-webkit-mask-composite:source-in;
  mask:var(--sil) 0 0/100% 100% no-repeat intersect,radial-gradient(circle at 51% 36%,transparent 0,transparent 8.5%,#000 10%,#000 11.8%,transparent 13%);
  background:linear-gradient(95deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%) 0 0/260% 100% no-repeat;background-position:110% 0;mix-blend-mode:screen;opacity:0}
.idle .emb{animation:embRing 4.5s cubic-bezier(.45,0,.35,1) 1.85s infinite}
@keyframes embRing{0%{opacity:0;background-position:110% 0}3%{opacity:1}18%{opacity:1}21%{opacity:0;background-position:-10% 0}100%{opacity:0;background-position:-10% 0}}
.embtop{position:absolute;left:51%;top:30.5%;width:10%;height:1.2%;margin-left:-5%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.95),transparent 70%);opacity:0;pointer-events:none;mix-blend-mode:screen}
.idle .embtop{animation:embTop 6.3s ease-out 3.6s infinite}
@keyframes embTop{0%{opacity:0;transform:scaleX(.3)}2%{opacity:1;transform:scaleX(1)}6%,100%{opacity:0;transform:scaleX(1.1)}}
.glis i{position:absolute;width:10%;aspect-ratio:1;margin:-5% 0 0 -5%;opacity:0;pointer-events:none;

  <div class="dark" id="dark"></div>
  <div class="tap" id="tapHint">Tap to see the final table</div>
</div>
<script>
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
let AC=null; function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==="suspended") AC.resume(); return AC; }
function tone(f,dur,type="sine",vol=.1,when=0,slideTo){ const a=ac(); if(!a) return; const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+when; o.type=type; o.frequency.setValueAtTime(f,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05); }
let NOISE=null; function noise(a){ if(NOISE) return NOISE; const n=a.sampleRate*2,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return NOISE=b; }
function swish(when=0,dur=.3,vol=.18,lo=500,hi=4200){ const a=ac(); if(!a) return; const t=a.currentTime+when,s=a.createBufferSource(); s.buffer=noise(a); const f=a.createBiquadFilter(); f.type="bandpass"; f.Q.value=.9; f.frequency.setValueAtTime(lo,t); f.frequency.exponentialRampToValueAtTime(hi,t+dur); const g=a.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur*.6); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t+dur+.05); }
function bell(f,when=0,dur=1.4,vol=.1){ const a=ac(); if(!a) return; const t=a.currentTime+when; [[1,1,1],[2.76,.4,.45],[5.4,.18,.25]].forEach(([m,amp,len])=>{ const o=a.createOscillator(),g=a.createGain(); o.frequency.value=f*m; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol*amp,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+dur*len); o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur*len+.05); }); }
function boom(when=0){ const a=ac(); if(!a) return; const t=a.currentTime+when,s=a.createBufferSource(); s.buffer=noise(a); const f=a.createBiquadFilter(); f.type="lowpass"; f.frequency.setValueAtTime(1800,t); f.frequency.exponentialRampToValueAtTime(110,t+.45); const g=a.createGain(); g.gain.setValueAtTime(.45,t); g.gain.exponentialRampToValueAtTime(.0001,t+.5); s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t+.55); tone(58,.6,"sine",.3,when,34); }
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// satin highlights follow each ribbon's own shape
document.querySelectorAll(".trophy .rib").forEach(r => { const href = r.querySelector("image").getAttribute("href"), s = r.querySelector(".satin"); s.style.webkitMaskImage = s.style.maskImage = `url(${href})`; });
const E = { ease:"cubic-bezier(.16,1,.3,1)", decel:"cubic-bezier(.12,.9,.2,1)" };

function streaksOut(){
  const fx=$("fx");
  const cols=["#04f5ff","#00ff85","#04f5ff","#b56cff","#00ff85"];
  cols.forEach((c,i)=>{ const s=document.createElement("i"); s.className="streak"; const ang=i*72+Math.random()*30; s.style.background=`linear-gradient(90deg,transparent,${c} 40%,#fff 70%,transparent)`; fx.appendChild(s);
    s.animate([{opacity:0,transform:`rotate(${ang}deg) translateX(4vmin) scaleX(.1)`},{opacity:1,transform:`rotate(${ang}deg) translateX(10vmin) scaleX(1)`,offset:.35},{opacity:0,transform:`rotate(${ang}deg) translateX(60vmin) scaleX(.6)`}],{duration:140,easing:"ease-out",fill:"forwards"}).onfinish=()=>s.remove(); });
  [45,135,225,315].forEach(a=>{ const s=document.createElement("i"); s.className="streak"; s.style.background="linear-gradient(90deg,transparent,#b56cff 45%,#e7c6ff 70%,transparent)"; s.style.height="2px"; fx.appendChild(s);
    s.animate([{opacity:0,transform:`rotate(${a}deg) translateX(6vmin) scaleX(.2)`},{opacity:.9,transform:`rotate(${a}deg) translateX(20vmin) scaleX(1)`,offset:.4},{opacity:0,transform:`rotate(${a}deg) translateX(80vmin) scaleX(.5)`}],{duration:200,easing:"ease-out",fill:"forwards"}).onfinish=()=>s.remove(); });
}
function sparks(){
  const fx=$("fx");
  for (let i=0;i<26;i++){ const s=document.createElement("i"); s.className="spk"; fx.appendChild(s);
    const a=Math.random()*Math.PI*2, d=60+Math.random()*Math.min(innerWidth,520)*.55;
    s.animate([{opacity:1,transform:"translate(-50%,-50%) scale(1)"},{opacity:0,transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(.3)`}],{duration:380+Math.random()*260,easing:"cubic-bezier(.1,.8,.3,1)",fill:"forwards"}).onfinish=()=>s.remove(); }
}
// confetti in three depth layers with explosive radial motion, drag, tumble and gravity
const CCOL=["#3a0a5e","#7b2ff7","#9d4dff","#04f5ff","#13c8c8","#00ff85","#10b981"];
const SHAPES=["strip","diamond","tri","square","frag","curl"];
function piece(layer){
  const el=document.createElement("i"), shape=SHAPES[Math.floor(Math.random()*SHAPES.length)], silver=Math.random()<.13, col=CCOL[Math.floor(Math.random()*CCOL.length)];
  el.className=`cp ${shape}${silver?" silver":""}`; el.style.setProperty("--col", silver?"#e9edf2":col);
  const base = layer==="back"?5:layer==="mid"?9:26, sz = base*(0.8+Math.random()*0.6);
  const dims={strip:[sz*.4,sz*1.4],diamond:[sz,sz*1.2],tri:[sz,sz],square:[sz*.9,sz*.9],frag:[sz*.28,sz*2],curl:[sz*1.4,sz*1.4]}[shape];
  el.style.width=dims[0]+"px"; el.style.height=dims[1]+"px"; el.style.marginLeft=(-dims[0]/2)+"px"; el.style.marginTop=(-dims[1]/2)+"px";
  if (shape!=="curl" && !silver) el.style.background=col;
  if (layer==="back") el.style.filter="blur(.8px) brightness(.8)";
  return {el, silver};
}
function confettiBurst(){
  const back=$("confBack"), front=$("confFront"); back.innerHTML=""; front.innerHTML="";
  const W=innerWidth, H=innerHeight, g=H*1.1;
  const spawn=(layer, n)=>{ for(let i=0;i<n;i++){
    const {el,silver}=piece(layer); (layer==="back"?back:front).appendChild(el);
    const ang=Math.random()*Math.PI*2, sp=(layer==="back"?520:layer==="mid"?950:500)*(0.6+Math.random()*0.8);
    const T = layer==="front" ? 800+Math.random()*450 : (layer==="back"?2300:1900)+Math.random()*900;
    const k = layer==="front" ? 1.2 : 3.2, frames=[];
    const rx=(Math.random()*2-1)*900, ry=(Math.random()*2-1)*900, rz=(Math.random()*2-1)*720, wob=Math.random()*18+6, wf=2+Math.random()*3;
    for (let j=0;j<=14;j++){
      const f=j/14, t=f*T/1000, dragd=(1-Math.exp(-k*t))/k;
      let x=Math.cos(ang)*sp*dragd, y=Math.sin(ang)*sp*dragd + (layer==="front"?0.15:0.5)*g*t*t*0.55;
      x += Math.sin(t*wf*Math.PI)*wob*f;
      const sc = layer==="front" ? 1+Math.pow(f,1.6)*5.5 : 1;
      const op = layer==="front" ? (f<.05?f/.05:1-Math.max(0,(f-.7)/.3)) : (f<.03?f/.03:f>.8?1-(f-.8)/.2:1);
      const bl = layer==="front" ? Math.min(6,f*9) : (layer==="back"?.8:0);
      const fr={offset:f,opacity:op,transform:`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,${layer==="front"?(f*300).toFixed(0):0}px) rotateX(${(rx*f).toFixed(0)}deg) rotateY(${(ry*f).toFixed(0)}deg) rotateZ(${(rz*f).toFixed(0)}deg) scale(${sc.toFixed(2)})`};
      if (layer==="front") fr.filter=`blur(${bl.toFixed(1)}px)`;
      if (silver && layer!=="front") fr.filter=`brightness(${(j%5===2?2.4:1).toFixed(1)})${layer==="back"?" blur(.8px)":""}`;
      frames.push(fr);
    }
    el.animate(frames,{duration:T,easing:"linear",fill:"forwards"}).onfinish=()=>el.remove();
  }};
  spawn("back",34); spawn("mid",46); spawn("front",10);
}

let busy=false, idleTimer=null;
function boltSweep(el, cls){ const a = el.querySelector("animateTransform."+cls); if (a && a.beginElement) a.beginElement(); }
async function play(){
  if (busy) return; busy = true; ac();
  const ov=$("ov"), tr=$("trophy"), pill=$("pill"), stage=$("stage"), bolts=[...document.querySelectorAll(".bolt")];
  const glows={core:ov.querySelector(".glow.core"),emerald:ov.querySelector(".glow.emerald"),haze:ov.querySelector(".glow.haze"),purple:ov.querySelector(".glow.purple")};
  const name=($("nm").value||"Champion").trim(), pts=Math.max(0,parseInt($("pts").value||"0",10));
  $("pillName").textContent=name; $("pillSc").textContent="0";
  const every=[tr,pill,stage,$("dark"),$("bolts"),$("bgbase"),$("tapHint"),...bolts,...Object.values(glows),...ov.querySelectorAll(".rib .react, .floor i, .edge, .cry, .crown"),$("point"),$("burst"),$("wave"),$("vig")];
  every.forEach(el=>el.getAnimations().forEach(a=>{ if(!(a instanceof CSSAnimation)) a.cancel(); }));
  ov.classList.remove("idle");
  $("start").classList.add("hidden"); $("final").classList.add("hidden"); ov.classList.remove("hidden");
  let skip; const sig=new Promise(r=>skip=r); ov.onclick=()=>skip();
  const A=(el,f,o)=>el.animate(f,Object.assign({fill:"both"},o));
  if (REDUCED){
    bolts.forEach(b=>b.style.opacity=1); tr.style.opacity=1; Object.values(glows).forEach(g=>g.style.opacity=.8); ov.classList.add("idle");
  } else {
    const at = (ms, fn) => setTimeout(() => { if (!ov.classList.contains("hidden")) fn(); }, ms);
    // 0.00 to 0.15s: near dark, a teal-white point of light at the centre, faint energy streaks pulled inward
    A($("dark"),[{opacity:.72},{opacity:.66,offset:.5},{opacity:0,offset:.62},{opacity:0}],{duration:500,easing:"linear"});
    A($("point"),[{opacity:0,transform:"scale(.1)"},{opacity:.7,transform:"scale(.25)",offset:.3},{opacity:.9,transform:"scale(.45)",offset:.6},{opacity:1,transform:"scale(1.2)",offset:.97},{opacity:0,transform:"scale(1.6)"}],{duration:320,easing:"cubic-bezier(.6,0,.9,.5)"});
    const inw=$("inward"); inw.innerHTML="";
    ["#04f5ff","#00ff85","#b56cff","#04f5ff","#00ff85","#b56cff","#04f5ff","#00ff85"].forEach((c,i)=>{ const l=document.createElement("i"); const ang=i*45+15;
      l.style.background=`linear-gradient(90deg,transparent,${c})`; inw.appendChild(l);
      A(l,[{opacity:0,transform:`rotate(${ang}deg) scaleX(1) translateX(10%)`},{opacity:.35,transform:`rotate(${ang}deg) scaleX(.8) translateX(0)`,offset:.35},{opacity:.5,transform:`rotate(${ang}deg) scaleX(.12) translateX(0)`,offset:.95},{opacity:0,transform:`rotate(${ang}deg) scaleX(.02)`}],{duration:300,delay:20+i*8,easing:"cubic-bezier(.5,0,.9,.6)"}); });
    // 0.15 to 0.30s: the bolts appear faintly, drawn inward, and the centre gets brighter
    bolts.forEach((b,i)=>{ b.style.transformOrigin="50% 44%";
      A(b,[{opacity:0,transform:"scale(.55)"},{opacity:.28,transform:"scale(.46)",offset:.3},{opacity:.3,transform:"scale(.38)",offset:.46},
           {opacity:1,transform:"scale(1.05)",filter:"brightness(1.7) drop-shadow(0 0 12px rgba(4,245,255,.9))",offset:.66},{opacity:1,transform:"scale(.985)",filter:"brightness(1.3) drop-shadow(0 0 6px rgba(4,245,255,.5))",offset:.8},
           {opacity:1,transform:"scale(1)",filter:"brightness(1) drop-shadow(0 0 0 rgba(4,245,255,0))"}],{duration:980,delay:(i>2?30:0),easing:"cubic-bezier(.3,.1,.2,1)"});
    });
    A(glows.core,[{opacity:0,transform:"translate(-50%,-50%) scale(.1)"},{opacity:.6,transform:"translate(-50%,-50%) scale(.2)",offset:.25},{opacity:1,transform:"translate(-50%,-50%) scale(1.3)",offset:.45},{opacity:.95,transform:"translate(-50%,-50%) scale(1.1)",offset:.65},{opacity:.85,transform:"translate(-50%,-50%) scale(1)"}],{duration:900,easing:"linear"});
    A(glows.emerald,[{opacity:0,transform:"translate(-50%,-50%) scale(.3)"},{opacity:0,offset:.3},{opacity:1,transform:"translate(-50%,-50%) scale(1.25)",offset:.5},{opacity:.85,transform:"translate(-50%,-50%) scale(1)"}],{duration:900,easing:"linear"});
    A(glows.haze,[{opacity:0,transform:"translate(-50%,-50%) scale(.4)"},{opacity:0,offset:.32},{opacity:1,transform:"translate(-50%,-50%) scale(1.2)",offset:.6},{opacity:.85,transform:"translate(-50%,-50%) scale(1)"}],{duration:1000,easing:"linear"});
    A(glows.purple,[{opacity:0},{opacity:0,offset:.35},{opacity:1,offset:.6},{opacity:.85}],{duration:1000,easing:"linear"});
    swish(.02,.3,.14,300,1400); tone(120,.32,"sine",.09,0,480);
    // 0.30s: the explosion
    at(300,()=>{
      A($("burst"),[{opacity:0,transform:"scale(.2)"},{opacity:1,transform:"scale(.7)",offset:.12},{opacity:.55,transform:"scale(1)",offset:.4},{opacity:0,transform:"scale(1.15)"}],{duration:520,easing:"ease-out"});
      A($("wave"),[{opacity:0,transform:"scale(.3)"},{opacity:1,transform:"scale(1.2)",offset:.25},{opacity:0,transform:"scale(4.2)"}],{duration:420,easing:"cubic-bezier(.2,.7,.3,1)"});
      A($("bgbase"),[{filter:"brightness(1)",transform:"scale(1.02)"},{filter:"brightness(1.35)",transform:"scale(1.012)",offset:.2},{filter:"brightness(1)",transform:"scale(1)"}],{duration:600,easing:"ease-out"});
      A($("vig"),[{opacity:1},{opacity:.55}],{duration:500,easing:"ease-out"});
      A(stage,[{transform:"translate(0,0)"},{transform:"translate(-5px,3px)",offset:.2},{transform:"translate(4px,-2.5px)",offset:.42},{transform:"translate(-2.5px,1.5px)",offset:.64},{transform:"translate(1.2px,-.8px)",offset:.84},{transform:"translate(0,0)"}],{duration:250,delay:20});
      streaksOut(); sparks(); confettiBurst();
      boom(); bell(2637,.02,.8,.05); try{navigator.vibrate&&navigator.vibrate([35,25,110])}catch(e){}
      // ribbons thrown outward, overshoot, whip back and settle over about 1.6s
      const rl=ov.querySelector(".ribL .react"), rr=ov.querySelector(".ribR .react");
      A(rl,[{transform:"rotate(0)"},{transform:"rotate(-62deg)",offset:.1},{transform:"rotate(-48deg)",offset:.18},{transform:"rotate(16deg)",offset:.34},{transform:"rotate(-9deg)",offset:.5},{transform:"rotate(5deg)",offset:.66},{transform:"rotate(-2deg)",offset:.82},{transform:"rotate(0)"}],{duration:1600,easing:"ease-out"});
      A(rr,[{transform:"rotate(0)"},{transform:"rotate(60deg)",offset:.1},{transform:"rotate(47deg)",offset:.19},{transform:"rotate(-15deg)",offset:.35},{transform:"rotate(8deg)",offset:.52},{transform:"rotate(-4.5deg)",offset:.68},{transform:"rotate(1.8deg)",offset:.84},{transform:"rotate(0)"}],{duration:1650,easing:"ease-out"});
    });
    // 0.30 to 0.85s: trophy fired at the viewer, 60% to 108% overshoot, settles; exposure spikes and normalises
    A(tr,[{opacity:0,transform:"translateY(18px) scale(.6) rotate(-2deg)",filter:"blur(14px) brightness(1.45)"},
          {opacity:1,transform:"translateY(12px) scale(.64) rotate(-1.8deg)",filter:"blur(12px) brightness(1.45)",offset:.04},
          {opacity:1,transform:"translateY(4px) scale(.82) rotate(-1deg)",filter:"blur(6px) brightness(1.18)",offset:.24},
          {opacity:1,transform:"translateY(-4px) scale(1.02) rotate(.2deg)",filter:"blur(1px) brightness(1.08)",offset:.45},
          {opacity:1,transform:"translateY(-6px) scale(1.08) rotate(1deg)",filter:"blur(0px) brightness(1.04)",offset:.6},
          {opacity:1,transform:"translateY(1px) scale(1.01) rotate(.2deg)",filter:"blur(0px) brightness(1.01)",offset:.8},
          {opacity:1,transform:"translateY(0) scale(1) rotate(0)",filter:"blur(0px) brightness(1)"}],{duration:550,delay:300,easing:"linear"});
    ov.querySelectorAll(".edge,.cry,.crown").forEach(el=>A(el,[{filter:"brightness(1)"},{filter:"brightness(2.2) saturate(1.4)",offset:.15},{filter:"brightness(1)"}],{duration:700,delay:320}));
    swish(.3,.45,.24,250,3200);
    at(200,()=>{ boltSweep(bolts[0],"entry"); boltSweep(bolts[1],"entry"); boltSweep(bolts[2],"entry"); });
    // 0.85s: settled; start the idle lighting (hero shimmer at 0.90s, crown glisten 1.30s)
    at(850,()=>{ const gl=[...ov.querySelectorAll(".glis i")]; [.45,1.25,2.55,3.65,.9].forEach((d,i)=>gl[i]&&(gl[i].style.animationDelay=d+"s")); ov.classList.add("idle"); });
    await Promise.race([wait(1900),sig]);
  }
  // 1.10s onwards: the idle scene
  ov.classList.add("idle");
  // bolts idle drift and an occasional faint charge along one of them
  [["-.5vw,.3vh",13000],["-.5vw,.3vh",13000],[".6vw,-.3vh",14500],["-.7vw,0",11800],[".6vw,0",12600]].forEach(([to,d],i)=>bolts[i].animate([{transform:"translate(0,0)"},{transform:`translate(${to})`}],{duration:d,direction:"alternate",iterations:Infinity,easing:"ease-in-out"}));
  let bi=1; clearInterval(idleTimer); idleTimer=setInterval(()=>{ boltSweep(bolts[bi%3],"idle"); bi++; },3500);
  // winner pill
  A(pill,[{opacity:0,transform:"translateY(22px) scale(.96)"},{opacity:1,transform:"none"}],{duration:500,delay:REDUCED?0:100,easing:E.ease});
  const t0=performance.now()+200; const step=now=>{ const k=Math.max(0,Math.min(1,(now-t0)/800)); $("pillSc").textContent=Math.round(pts*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); }; requestAnimationFrame(step);
  [523,659,784,1047].forEach((f,i)=>bell(f,.2+i*.1,1.8,.05)); [1047,1319,1568].forEach(f=>bell(f,.65,2.6,.04));
  await Promise.race([wait(REDUCED?4000:14000),sig]);
  clearInterval(idleTimer);
  $("pillSc").textContent=pts;
  // hand-over to the final table: trophy up and away, pill into first place
  $("finalSub").textContent=`${name} wins with ${pts} points.`;
  $("rows").innerHTML=`<div class="pod first" id="row1" style="opacity:0"><span class="place">1st</span><span class="nm">${esc(name)}</span><span class="sc">${pts}</span></div>
    <div class="pod" style="opacity:0"><span class="place">2nd</span><span class="nm">Player 2</span><span class="sc">${Math.max(0,pts-5)}</span></div>
    <div class="pod" style="opacity:0"><span class="place">3rd</span><span class="nm">Player 3</span><span class="sc">${Math.max(0,pts-8)}</span></div>`;
  $("final").classList.remove("hidden");
  const target=$("row1").getBoundingClientRect(), from=pill.getBoundingClientRect();
  const dx=target.left+target.width/2-(from.left+from.width/2), dy=target.top+target.height/2-(from.top+from.height/2), sx=target.width/from.width, sy=target.height/from.height;
  const D=REDUCED?1:800;
  A($("tzone"),[{opacity:1,transform:"translateY(0) scale(1)"},{opacity:0,transform:"translateY(-42vh) scale(.3)"}],{duration:D*.9,easing:"cubic-bezier(.55,0,.3,1)"});
  [$("bolts"),$("particles"),$("wave"),$("vig"),ov.querySelector(".bgshift.a"),ov.querySelector(".bgshift.b")].forEach(el=>A(el,[{opacity:getComputedStyle(el).opacity},{opacity:0}],{duration:D}));
  A($("bgbase"),[{opacity:1},{opacity:0}],{duration:D,delay:D*.2});
  A($("tapHint"),[{opacity:.55},{opacity:0}],{duration:200});
  swish(0,.5,.12,2500,600);
  await A(pill,[{transform:"none"},{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`}],{duration:D,easing:"cubic-bezier(.65,0,.35,1)"}).finished.catch(()=>{});
  $("row1").style.opacity=1; ov.classList.add("hidden"); ov.classList.remove("idle");
  [...document.querySelectorAll("#rows .pod")].slice(1).forEach((r,i)=>r.animate([{opacity:0,transform:"translateY(12px)"},{opacity:1,transform:"none"}],{duration:400,delay:120+i*120,fill:"forwards",easing:E.ease}));
  document.querySelectorAll("#ov *, #ov").forEach(el=>el.getAnimations&&el.getAnimations().forEach(a=>{ if(!(a instanceof CSSAnimation)) a.cancel(); }));
  [tr,pill,...bolts,...Object.values(glows)].forEach(el=>el.style.opacity="");
  busy=false;
}
$("playBtn").onclick=play;
$("againBtn").onclick=()=>{ $("final").classList.add("hidden"); $("start").classList.remove("hidden"); };
</script>
